name: Auto Version Bump

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump from commit tags
        id: bump
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            RANGE="$LAST_TAG..HEAD"
          else
            RANGE="HEAD"
          fi

          COMMITS=$(git log $RANGE --pretty=%s)

          BUMP=""
          if echo "$COMMITS" | grep -qiE '^feat(\(.+\))?!?:'; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qiE '^(fix|hotfix)(\(.+\))?!?:'; then
            BUMP="patch"
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

      - name: Bump package.json version
        if: steps.bump.outputs.bump != ''
        run: |
          npm version ${{ steps.bump.outputs.bump }} --no-git-tag-version
          echo "new_version=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Commit and tag the new version
        if: steps.bump.outputs.bump != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "🔖 v${{ env.new_version }} [skip ci]"
          git tag "v${{ env.new_version }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ env.new_version }}"
