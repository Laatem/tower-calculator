name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Titre de la PR : $PR_TITLE"
          PATTERN='^(feat|fix|chore|docs|refactor|perf|test|build|ci|style)(\([a-zA-Z0-9_-]+\))?!?: .+'
          if ! [[ "$PR_TITLE" =~ $PATTERN ]]; then
            echo "::error::Le titre de la PR ne respecte pas le format Conventional Commits attendu par release-please. Exemples valides : 'feat: ajoute X', 'fix(hotfix): corrige Y'. Titre reçu : $PR_TITLE"
            exit 1
          fi
          echo "Titre valide."
