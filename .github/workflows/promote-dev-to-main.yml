name: Promote dev to main

on:
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-promotion-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or reuse the dev -> main PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main

          if git diff --quiet origin/main...HEAD; then
            echo "dev et main sont identiques, rien à promouvoir."
            exit 0
          fi

          EXISTING=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR dev -> main déjà ouverte : #$EXISTING (elle se met à jour toute seule)"
            exit 0
          fi

          gh pr create \
            --base main \
            --head dev \
            --title "chore: promote dev to main" \
            --body "PR automatique regroupant les changements de \`dev\` prêts à partir en production.
